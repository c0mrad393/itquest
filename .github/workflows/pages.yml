# Publishes the live demo to GitHub Pages.
#
# The app is entirely client-side — no API routes, no database, no server state —
# so `next build` with `output: "export"` produces a complete static site and the
# demo costs nothing to host. See the GITHUB_PAGES note in next.config.mjs.
name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one midway or the site can be left half
# swapped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_DIST_DIR: site
        run: npx next build
      # Pages serves what it is given verbatim, and Jekyll would otherwise strip
      # the _next directory every asset lives in.
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
