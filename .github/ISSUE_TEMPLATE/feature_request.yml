name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: What are you trying to do that you currently cannot?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
    validations:
      required: true
